name: Build SharkMentor Mark 45 APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  checks: write

jobs:
  build-debug-apk:
    name: Assemble Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Generate local.properties from GitHub Secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
        run: |
          cat <<EOF > local.properties
          sdk.dir=${ANDROID_HOME}
          GEMINI_API_KEY=${GEMINI_API_KEY}
          GEMINI_API_KEYS=${GEMINI_API_KEYS}
          DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
          KIMI_API_KEY=${KIMI_API_KEY}
          EOF

      - name: Build Debug APK & Capture Diagnostics
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./gradlew
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e
          if [ $BUILD_EXIT -ne 0 ] || [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "=== COMPILER ERRORS (EXIT=$BUILD_EXIT) ==="
            grep -E "^e: |FAILURE:|What went wrong:|^\* |Exception|Error:|Unresolved reference" build.log | tail -n 120 > error_summary.txt || true
            echo "=== LAST 100 LINES ===" >> error_summary.txt
            tail -n 100 build.log >> error_summary.txt
            python3 - << 'PYEOF'
          import subprocess, os
          body = "### ❌ Build Diagnostic Log\n```\n" + open("error_summary.txt", errors="ignore").read()[-8000:] + "\n```"
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          subprocess.run(["gh", "api", f"repos/{repo}/commits/{sha}/comments", "-f", f"body={body}"], check=False)
          PYEOF
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SharkMentor-Mark45-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Direct Mobile APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SharkMentor-Mark45-debug.apk
          gh release delete mark45-apk --yes --cleanup-tag 2>/dev/null || true
          gh release create mark45-apk SharkMentor-Mark45-debug.apk \
            --title "Shark Mentor Study Mark 45 (Debug APK)" \
            --notes "Otomatik bulut derlemesi ile üretilen doğrudan telefona kurulabilir APK paketi."
