name: Build SharkMentor Mark 45 APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  checks: write

jobs:
  build-debug-apk:
    name: Assemble Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Generate local.properties from GitHub Secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
        run: |
          python3 - << 'PYEOF'
          import os, re

          def clean_val(v: str) -> str:
              return (v or "").replace("\r", "").replace("\n", "").replace('"', "").replace("'", "").replace("\\", "").strip()

          sdk_dir = os.environ.get("ANDROID_HOME", "")
          g_single = clean_val(os.environ.get("GEMINI_API_KEY", ""))
          g_multi_raw = os.environ.get("GEMINI_API_KEYS", "") or ""
          multi_parts = [clean_val(p) for p in re.split(r"[,;\s]+", g_multi_raw) if clean_val(p)]
          all_gemini = []
          for k in (multi_parts + ([g_single] if g_single else [])):
              if k and k not in all_gemini:
                  all_gemini.append(k)

          g_multi = ",".join(all_gemini)
          g_primary = g_single or (all_gemini[0] if all_gemini else "")
          deepseek = clean_val(os.environ.get("DEEPSEEK_API_KEY", ""))
          kimi = clean_val(os.environ.get("KIMI_API_KEY", ""))

          lines = [
              f"sdk.dir={sdk_dir}",
              f"GEMINI_API_KEY={g_primary}",
              f"GEMINI_API_KEYS={g_multi}",
              f"DEEPSEEK_API_KEY={deepseek}",
              f"KIMI_API_KEY={kimi}",
          ]
          with open("local.properties", "w", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")

          lens = [len(k) for k in all_gemini]
          summary = (
              f"Secrets check -> GEMINI keys={len(all_gemini)} lens={lens}, "
              f"DEEPSEEK configured={bool(deepseek)} (len={len(deepseek)}), "
              f"KIMI configured={bool(kimi)} (len={len(kimi)})"
          )
          print(summary)
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as sf:
                  sf.write(f"### 🔐 Build Secret Injection Status\n{summary}\n")
          PYEOF

      - name: Build Debug APK & Capture Diagnostics
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./gradlew
          set +e
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e
          if [ $BUILD_EXIT -ne 0 ] || [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "=== KOTLIN COMPILER ERRORS (e:) ===" > error_summary.txt
            grep -E "e: |FAILURE:|What went wrong:|^\* |> Task .* FAILED" build.log >> error_summary.txt || true
            echo "=== TAIL OF BUILD LOG ===" >> error_summary.txt
            tail -n 60 build.log >> error_summary.txt
            python3 - << 'PYEOF'
          import subprocess, os
          content = open("error_summary.txt", errors="ignore").read()[:14000]
          body = "### ❌ Build Diagnostic Log\n```\n" + content + "\n```"
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          subprocess.run(["gh", "api", f"repos/{repo}/commits/{sha}/comments", "-f", f"body={body}"], check=False)
          PYEOF
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SharkMentor-Mark45-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Direct Mobile APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SharkMentor-Mark45-debug.apk
          gh release delete mark45-apk --yes --cleanup-tag 2>/dev/null || true
          gh release create mark45-apk SharkMentor-Mark45-debug.apk \
            --title "Shark Mentor Study Mark 45 (Debug APK)" \
            --notes "Otomatik bulut derlemesi ile üretilen doğrudan telefona kurulabilir APK paketi."
